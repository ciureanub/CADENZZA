<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CADENZZA</title>
<style>
/* System fonts only — no CDN, no outbound request. */
:root{
  --navy:#0d1520; --navy2:#121d2b; --navy3:#18263a; --line:#22354d;
  --gold:#c9a227; --teal:#2fb6a5; --text:#dde5ef; --dim:#8298b3; --red:#d9534f;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:var(--text);font:14px/1.55 var(--sans);height:100vh;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:238px 1fr;height:100vh}

/* sidebar */
aside{background:var(--navy2);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font:600 21px/1 var(--serif);letter-spacing:.16em;color:var(--gold)}
.brand small{color:var(--dim);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.spaces{padding:8px 0;border-bottom:1px solid var(--line)}
.sp{display:flex;gap:9px;align-items:center;padding:7px 16px;cursor:pointer;border-left:2px solid transparent}
.sp:hover{background:var(--navy3)}
.sp.on{background:var(--navy3);border-left-color:var(--gold)}
.sp b{font:600 10px/1 var(--mono);color:var(--gold);width:20px}
.tree{flex:1;overflow:auto;padding:8px 0}
.tg{padding:9px 16px 4px;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
.pg{padding:5px 16px 5px 22px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.pg:hover{background:var(--navy3)}
.pg.on{background:var(--navy3);color:var(--gold)}
.pg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font:9px/1.6 var(--mono);padding:0 4px;border-radius:2px;background:#2a3d57;color:var(--dim);flex-shrink:0}
.chip.cc{background:#4a2f1a;color:#e0a95f}.chip.re{background:#4a1f1f;color:#e88}
.sidefoot{border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap}

/* main */
main{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:8px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--navy2)}
#q{flex:1;background:var(--navy);border:1px solid var(--line);border-radius:4px;padding:7px 10px;outline:none}
#q:focus{border-color:var(--gold)}
select,.btn{background:var(--navy3);border:1px solid var(--line);border-radius:4px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.p{background:var(--gold);color:#0d1520;border-color:var(--gold);font-weight:600}
.btn.p:hover{color:#0d1520;opacity:.9}
.mode{font:10px/1 var(--mono);padding:5px 8px;border-radius:3px;background:#1c3b36;color:var(--teal);border:1px solid #24564e}
#body{flex:1;overflow:auto;padding:0 14px 14px}
.wrap{max-width:900px;margin:0 auto}
h2.sec{font:600 18px/1 var(--serif);margin:18px 0 8px;color:var(--gold);letter-spacing:.08em}
p.lede{color:var(--dim);font-size:13px;margin:0 0 14px}
.res{cursor:pointer;border:1px solid var(--line);padding:14px;margin:9px 0;border-radius:4px}
.res:hover{background:var(--navy3);border-color:var(--gold)}
.res h4{margin:0 0 6px;font:600 15px/1 var(--serif);color:var(--text);letter-spacing:.04em}
.res p{margin:0 0 9px;color:var(--dim);font-size:13px;line-height:1.5}
.res .m{font-size:11px;color:var(--dim);gap:6px;display:flex;flex-wrap:wrap}
.empty{text-align:center;color:var(--dim);padding:40px 20px;font-size:13px}
.pg, button { transition:all 100ms }
#ed{border:1px solid var(--line);background:var(--navy3);padding:14px;border-radius:4px;min-height:300px;outline:none;color:var(--text);line-height:1.6;margin:12px 0}
#ed:focus{border-color:var(--gold);outline:none}
#ed mark{background:#4a3f1a;color:#e0a95f;padding:2px 4px}
#src{border:1px solid var(--line);width:100%;padding:10px;background:var(--navy3);color:var(--mono);font-family:var(--mono);font-size:12px;line-height:1.4;border-radius:4px;outline:none;resize:vertical;min-height:200px}
#src:focus{border-color:var(--gold)}
table.data{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
table.data th{text-align:left;padding:9px 7px;border-bottom:1px solid var(--gold);color:var(--gold);font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase}
table.data td{padding:9px 7px;border-bottom:1px solid var(--line)}
table.data tr:hover{background:var(--navy3)}
table.data .mono{font-family:var(--mono);font-size:12px}
table.data .dim{color:var(--dim)}
table.data .gold{color:var(--gold)}
table.data .teal{color:var(--teal)}
table.data .empty{border:none;padding:40px;text-align:center;color:var(--dim)}
.row{display:flex;gap:9px;margin:12px 0}
.row input, .row select, .row button{ flex:1 }
input, select, button { border-radius:4px; padding:8px 11px; border:1px solid var(--line); background:var(--navy3); color:var(--text); cursor:pointer; }
input:focus, select:focus, button:focus { border-color:var(--gold); outline:none; }
input:placeholder-shown { color:var(--dim); }
.toolbar{display:flex;gap:6px;margin:9px 0;flex-wrap:wrap}
.toolbar button{padding:6px 10px;font-size:12px}
.sep{width:1px;height:20px;background:var(--line)}
#ed strong { color:var(--gold); font-weight:700; }
#ed em { color:var(--teal); font-style:italic; }
mark{background:#4a3f1a;color:#e0a95f;padding:1px 3px}
.pg span::before{content:attr(data-icon);margin-right:4px}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline}
.gold{color:var(--gold)}
.teal{color:var(--teal)}
.dim{color:var(--dim)}
#toast{position:fixed;bottom:20px;left:20px;background:var(--navy2);border:1px solid var(--gold);border-radius:4px;padding:12px 14px;color:var(--text);font-size:13px;z-index:1000;opacity:0;transition:opacity 300ms;pointer-events:none}
#toast.show{opacity:1;pointer-events:auto}
/* RAG: library drop zone, ingest progress, ask */
.drop{border:1px dashed var(--line);border-radius:4px;padding:20px;text-align:center;color:var(--dim);margin:12px 0;transition:all 100ms}
.drop.over{border-color:var(--gold);color:var(--gold);background:var(--navy3)}
.drop .row{max-width:680px;margin:12px auto 0}
body.dragging::after{content:'Drop to add to the Library';position:fixed;inset:12px;z-index:1000;pointer-events:none;display:flex;align-items:center;justify-content:center;border:2px dashed var(--gold);border-radius:6px;background:rgba(13,21,32,.85);color:var(--gold);font-size:18px}
.prog{display:grid;grid-template-columns:1fr 92px 120px 1fr;gap:10px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--line);font-size:12.5px}
.prog .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:4px;background:var(--navy3);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width 200ms}
.badge{font:10px/1.7 var(--mono);padding:0 6px;border-radius:2px;background:#2a3d57;color:var(--dim);white-space:nowrap}
.badge.ok{background:#1c3b36;color:var(--teal)}.badge.warn{background:#4a2f1a;color:#e0a95f}.badge.err{background:#4a1f1f;color:#e88}
.meta{font:11px/1.6 var(--mono);color:var(--dim);margin:8px 0}
.answer{border:1px solid var(--line);border-radius:4px;padding:14px;background:var(--navy3);white-space:pre-wrap;min-height:54px;line-height:1.6}
.answer.refused{border-color:#24564e;color:var(--dim)}
.cite{color:var(--gold);cursor:pointer;font:600 12px var(--mono)}
.cite:hover{text-decoration:underline}
details.src{border:1px solid var(--line);border-radius:4px;margin:6px 0;padding:7px 10px}
details.src[open]{background:var(--navy3)}
details.src.cited{border-color:var(--gold)}
details.src summary{cursor:pointer;font-size:13px}
details.src .chunk{white-space:pre-wrap;color:var(--dim);font-size:12.5px;margin:8px 0 4px}
.revealed{border-color:var(--red) !important}
.settings{display:grid;grid-template-columns:200px 1fr;gap:8px 14px;align-items:center;font-size:13px;margin:10px 0}
.settings label{color:var(--dim)}
@media(max-width:600px){#app{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand"><h1>CADENZZA</h1><small>0.2</small></div>
    <div class="spaces" id="spaces"></div>
    <div class="tree" id="tree"></div>
    <div class="sidefoot">
      <button class="btn" onclick="view('guard')" title="Protect names, clients, projects, hosts — mask them everywhere">Guard</button>
      <button class="btn" onclick="view('review')" id="revn" title="Triage pattern candidates before masking">Review</button>
      <button class="btn" onclick="view('audit')" title="Append-only log of exports and vault access">Audit</button>
      <button class="btn" id="libbtn" title="Drop training files, watch ingest progress, manage ingested documents">Library</button>
    </div>
  </aside>
  <main>
    <header>
      <input id="q" placeholder="Search   —   tag:environment  type:template  sensitivity:Restricted  &quot;exact phrase&quot;">
      <select id="mode"><option value="hybrid">Hybrid</option><option value="strict">Strict</option><option value="fuzzy">Fuzzy</option></select>
      <span class="mode" id="chatmode">PRIVATE</span>
      <button class="btn" id="askbtn" title="Ask the ingested material (answers cite their sources)">Ask</button>
      <button class="btn p" onclick="newPage()">+ Page</button>
    </header>
    <div id="body"><div class="wrap" id="wrap"></div></div>
  </main>
</div>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const api = async (u, o) => {
  const resp = await fetch('/api' + u, o ? {
    method: o.method || 'POST',
    headers: o.body ? { 'content-type': 'application/json' } : {}, // Fastify rejects an empty JSON body
    body: o.body ? JSON.stringify(o.body) : undefined
  } : undefined);
  if (!resp.ok) throw new Error((await resp.json()).error || resp.statusText);
  return resp.json();
};
const esc = (s) => s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';
const toast = (m) => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); };

let META = null, SPACE = 'release', PAGE = null, DIRTY = false, SRC = false;
/** Space pickers are hidden while there is only one space (0.2 merged everything into Release Management). */
const ONE_SPACE = () => (META.spaces.length < 2 ? ' hidden' : '');

async function boot() {
  META = await api('/meta');
  $('#spaces').innerHTML = META.spaces.map(s =>
    `<div class="sp" data-k="${s.key}" onclick="pick('${s.key}')"><b>${s.glyph}</b>${esc(s.name.replace(' Management',''))}</div>`).join('');
  $('#chatmode').textContent = (META.settings.chat_mode || 'private').toUpperCase() + (META.settings.offline === '1' ? ' · LOCAL' : '');
  $('#revn').textContent = 'Review' + (META.counts.candidates ? ' (' + META.counts.candidates + ')' : '');
  pick(SPACE);
}

async function pick(k) {
  SPACE = k;
  document.querySelectorAll('.sp').forEach(e => e.classList.toggle('on', e.dataset.k === k));
  const rows = await api('/space/' + k + '/tree');
  const grp = { deliverable: [], note: [], template: [], 'source-capture': [] };
  rows.forEach(r => (grp[r.type] || grp.note).push(r));
  const sec = (label, list) => list.length ? `<div class="tg">${label}</div>` + list.map(p =>
    `<div class="pg${PAGE && PAGE.id === p.id ? ' on' : ''}" onclick="openPage(${p.id})"><span>${esc(p.title)}</span>${
      p.sensitivity === 'Client-Confidential' ? '<i class="chip cc">CC</i>' :
      p.sensitivity === 'Restricted' ? '<i class="chip re">R</i>' : ''}</div>`).join('') : '';
  $('#tree').innerHTML = sec('Deliverables', grp.deliverable) + sec('Notes', grp.note) + sec('Sources', grp['source-capture']) + sec('Templates', grp.template)
}

async function home() { $('#wrap').innerHTML = '<div class="empty">Search or pick a page.</div>'; }

async function openPage(id) {
  PAGE = await api('/page/' + id);
  const html = PAGE.body_html, srcView = `<h3>HTML source</h3><textarea id="src">${esc(html)}</textarea>`;
  pick(SPACE);
  $('#wrap').innerHTML = `<h2 class="sec">${esc(PAGE.title)}</h2>
  <div class="row">
    <input id="title" value="${esc(PAGE.title)}">
    <select id="space"${ONE_SPACE()}>${META.spaces.map((s) => `<option value="${s.key}"${s.key === PAGE.space_key ? ' selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
    ${PAGE.tags?.length ? `<span class="dim" title="Former space or label; search with tag:name">${PAGE.tags.map((x) => '#' + esc(x)).join(' ')}</span>` : ''}
    <select id="sensitivity"><option value="Public"${PAGE.sensitivity==='Public'?' selected':''}>Public</option><option value="Restricted"${PAGE.sensitivity==='Restricted'?' selected':''}>Restricted</option><option value="Client-Confidential"${PAGE.sensitivity==='Client-Confidential'?' selected':''}>Client-Confidential</option></select>
    <button class="btn" onclick="save()">Save</button>
    <button class="btn" onclick="exportPage()">Export</button>
  </div>
  <div class="toolbar">
    <button onclick="cmd('bold')"><b>Bold</b></button><button onclick="cmd('italic')"><i>Italic</i></button><button onclick="cmd('underline')" style="text-decoration:underline">Underline</button>
    <button onclick="cmd('createLink',prompt('URL'))">Link</button>
    <button onclick="toggleSrc()" id="srcbtn">HTML</button>
    <button onclick="cmd('formatBlock','h2')">H2</button><button onclick="cmd('formatBlock','h3')">H3</button>
    <button onclick="cmd('formatBlock','p')">P</button><button onclick="cmd('formatBlock','blockquote')">Quote</button><button onclick="cmd('formatBlock','pre')">Code</button>
    <div class="sep"></div>
    <button onclick="table()">Table</button><button onclick="linkTo()">[[Link]]</button>
    <button onclick="cmd('removeFormat')">Clear</button>
  </div>
  <div id="ed" contenteditable="true">${PAGE.body_html || '<p></p>'}</div>
  <textarea id="src" spellcheck="false"></textarea>
  ${PAGE.backlinks.length?`<p class="lede" style="margin-top:14px">Linked from: ${PAGE.backlinks.map(b=>`<a href="#" onclick="openPage(${b.id});return false" class="gold">${esc(b.title)}</a>`).join(' · ')}</p>`:''}`;
  $('#ed').oninput = $('#title').oninput = () => DIRTY = true;
  pick(SPACE);
}

const cmd = (c, v) => { document.execCommand(c, false, v); $('#ed').focus(); DIRTY = true; };
function table() {
  const r = +prompt('Rows', '3'), c = +prompt('Columns', '3');
  if (!r || !c) return;
  cmd('insertHTML', '<table><tbody>' + Array.from({length:r},()=>'<tr>'+'<td>&nbsp;</td>'.repeat(c)+'</tr>').join('') + '</tbody></table><p></p>');
}
function linkTo() { const t = prompt('Page title to link to'); if (t) cmd('insertHTML', '[[' + t + ']]'); }
function toggleSrc() {
  SRC = !SRC;
  const src = $('#src'), ed = $('#ed');
  if (SRC) { ed.style.display = 'none'; src.style.display = 'block'; src.value = ed.innerHTML; $('#srcbtn').style.borderColor = 'var(--gold)'; }
  else { src.style.display = 'none'; ed.style.display = 'block'; ed.innerHTML = src.value; $('#srcbtn').style.borderColor = 'var(--line)'; }
}

async function save() {
  const space = $('#space').value, title = $('#title').value, sensitivity = $('#sensitivity').value, body_html = SRC ? $('#src').value : $('#ed').innerHTML;
  if (!title.trim()) return toast('Title required');
  try {
    await api('/page/' + PAGE.id, { method: 'PATCH', body: { title, space, sensitivity, body_html } });
    PAGE.title = title;
    DIRTY = false;
    toast(space !== PAGE.space_key ? 'Saved and moved' : 'Saved');
    PAGE.space_key = space;
    pick(space);
  } catch (e) {
    toast('Save error: ' + (e.message || e));
  }
}

async function exportPage() {
  const r = await fetch('/api/page/' + PAGE.id + '/export');
  if (!r.ok) return toast((await r.json()).error || 'Export blocked');
  const b = await r.blob(), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = PAGE.title.replace(/[^\w.-]+/g,'_') + '.html'; a.click();
  toast('Exported — masked and egress-checked');
}
async function newPage() {
  const t = prompt('Title'); if (!t) return;
  const p = await api('/page', { body: { space_key: SPACE, title: t, body_html: '<p></p>', type: 'note' } });
  PAGE = null; await openPage(p.id);
}

/* search */
let timer;
const qElem = $('#q'), mElem = $('#mode');
if (qElem && mElem) {
  qElem.oninput = () => { clearTimeout(timer); timer = setTimeout(run, 220); };
  mElem.onchange = run;
}
async function run() {
  try {
    const q = $('#q').value.trim();
    if (!q) { PAGE = null; return home(); }
    const rows = await api('/search?q=' + encodeURIComponent(q) + '&mode=' + $('#mode').value);
    $('#wrap').innerHTML = `<h2 class="sec">${rows.length} result${rows.length===1?'':'s'}</h2>
      <p class="lede">${esc($('#mode').value)} mode</p>` + (rows.map(r => `
      <div class="res" onclick="openPage(${r.id})"><h4>${esc(r.title)}</h4>
        <p>${r.snippet ? r.snippet.replace(/</g,'&lt;').replace(/&lt;mark&gt;/g,'<mark>').replace(/&lt;\/mark&gt;/g,'</mark>') : ''}</p>
        <div class="m">${r.space} · ${r.type} · ${r.sensitivity} · ${r.mode}${r.modes?' ['+r.modes.join('+')+']':''}</div>
      </div>`).join('') || '<div class="empty">Nothing found. Try Fuzzy.</div>');
  } catch (e) {
    console.error('Search error:', e);
    $('#wrap').innerHTML = '<div class="empty">Search error. Check console.</div>';
  }
}

/* panels */
async function view(what) {
  PAGE = null;
  if (what === 'guard') {
    const rows = await api('/entities');
    $('#wrap').innerHTML = `<h2 class="sec">Entity Guard</h2>
    <p class="lede">Deterministic, reversible pseudonymisation. One entity, one pseudonym, everywhere. The real names live encrypted in the vault and are never indexed, never exported.</p>
    <div class="row">
      <input id="ec" placeholder="Canonical name  (e.g. Northwind Energy SE)">
      <input id="ea" placeholder="Aliases, comma separated">
      <select id="et"><option value="org">org</option><option value="person">person</option><option value="project">project</option><option value="host">host</option><option value="other">other</option></select>
      <button class="btn p" onclick="addEnt()">Protect</button>
    </div>
    <table class="data"><tr><th>Pseudonym</th><th>Type</th><th>Canonical</th><th>Aliases</th><th></th></tr>
    ${rows.map(e => `<tr><td class="mono gold">${esc(e.pseudonym)}</td><td class="dim">${e.type}</td>
      <td>${esc(e.canonical)}</td><td class="dim">${esc(e.aliases.join(', '))}</td>
      <td style="white-space:nowrap">
  <button class="btn" onclick="retireEnt(${e.id})" title="Retire: stops matching new text, vault preserved">retire</button>
  <button class="btn" style="color:var(--red);border-color:var(--red);margin-left:4px" onclick="purgeEnt(${e.id})" title="Purge: permanently destroys vault entry — pseudonyms become unresolvable">purge</button>
</td></tr>`).join('')
      || '<tr><td colspan="5" class="empty">No protected entities yet. Add your employers and clients first.</td></tr>'}</table>
    <p class="lede" style="margin-top:16px">Matching covers punctuation and spacing variants automatically — one entry catches the dotted, undotted, hyphenated, spaced and legal-suffix forms. Context-only references ("the German utility") are not detectable; that is what the review queue is for. <strong>Retire</strong> stops an entity from matching new text while keeping its vault entry intact so historical pseudonyms remain resolvable. <strong>Purge</strong> destroys the vault entry permanently — use only for right-to-erasure compliance.</p>`;
  } else if (what === 'review') {
    const rows = await api('/review');
    $('#wrap').innerHTML = `<h2 class="sec">Review queue</h2>
    <p class="lede">Pattern and heuristic candidates. Nothing here is masked until you confirm it.</p>
    <table class="data"><tr><th>Surface</th><th>Layer</th><th>Conf.</th><th>Page</th><th></th></tr>
    ${rows.map(r => `<tr><td class="mono">${esc(r.surface)}</td><td class="dim">${r.layer}</td>
      <td class="dim">${r.confidence.toFixed(2)}</td><td class="dim">${esc(r.page_title)}</td>
      <td><button class="btn" onclick="triage(${r.id},'protect')">protect</button>
          <button class="btn" onclick="triage(${r.id},'ignore')">ignore</button></td></tr>`).join('')
      || '<tr><td colspan="5" class="empty">Nothing to triage.</td></tr>'}</table>`;
  } else {
    const rows = await api('/audit');
    $('#wrap').innerHTML = `<h2 class="sec">Audit log</h2>
    <p class="lede">Append-only. Every export, vault access and entity change.</p>
    <table class="data"><tr><th>When</th><th>Action</th><th>Detail</th></tr>
    ${rows.map(r=>`<tr><td class="mono dim">${esc(r.ts)}</td><td class="mono teal">${esc(r.action)}</td><td class="dim">${esc(r.detail||'')}</td></tr>`).join('')}</table>`;
  }
}
async function addEnt() {
  const canonical = $('#ec').value.trim(); if (!canonical) return;
  await api('/entities', { body: { canonical, aliases: $('#ea').value, type: $('#et').value } });
  toast('Protected'); view('guard');
}
async function retireEnt(id) {
  await api('/entities/' + id, { method: 'DELETE' });
  toast('Retired — vault preserved, pseudonym still resolvable');
  view('guard');
}
async function purgeEnt(id) {
  if (!confirm('PERMANENT: destroy vault entry for this entity?\n\nAny pseudonym already in pages will become unresolvable. This cannot be undone.')) return;
  await api('/entities/' + id + '?purge=1', { method: 'DELETE' });
  toast('Purged — vault entry destroyed');
  view('guard');
}
async function triage(id, action) {
  await api('/review/' + id, { body: { action } });
  META = await api('/meta'); $('#revn').textContent = 'Review' + (META.counts.candidates ? ' (' + META.counts.candidates + ')' : '');
  view('review');
}

addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); $('#q').focus(); $('#q').select(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); if (PAGE) save(); }
});
addEventListener('beforeunload', e => { if (DIRTY) { e.preventDefault(); e.returnValue = ''; } });

/* ======================================================================
   RAG (v0.2): Library = drop zone + live ingest progress + documents + settings;
   Ask = streamed, cited answers. Everything shown is pseudonymised; real names
   appear only through the explicit, audited "Reveal names" toggle.
   ====================================================================== */
const ACCEPT = ['.pdf', '.docx', '.doc', '.pptx', '.html', '.htm', '.md', '.markdown', '.txt', '.mhtml', '.mht'];
const DONE_STAGES = ['indexed', 'failed', 'unchanged', 'duplicate', 'deleted'];
const RAGUI = { progress: new Map(), es: null, reload: null, ask: null };
const when = (d) => d ? new Date(d).toLocaleString() : '';
const where = (s) => [s.title, ...(s.heading_path || [])].filter((x, i, a) => x && x !== a[i - 1]).join(' › ');
const pageOf = (s) => s.page_start ? ` · p.${s.page_start}${s.page_end && s.page_end !== s.page_start ? '-' + s.page_end : ''}` : '';

/* ---------- live progress (SSE) ---------- */
function ragEvents() {
  if (RAGUI.es) return;
  RAGUI.es = new EventSource('/api/rag/events');
  RAGUI.es.addEventListener('progress', (m) => onProgress(JSON.parse(m.data)));
}

function onProgress(e) {
  const cur = RAGUI.progress.get(e.doc_id) || { doc_id: e.doc_id };
  cur.stage = e.stage;
  for (const k of ['filename', 'title', 'chunks', 'error', 'duplicate_of', 'points']) if (e[k] != null) cur[k] = e[k];
  if (e.stage === 'embedding') { cur.embedded = e.embedded; cur.of = e.of; }
  if (e.stage === 'indexed' && cur.of) cur.embedded = cur.of;
  RAGUI.progress.set(e.doc_id, cur);
  renderProgress();
  if (DONE_STAGES.includes(e.stage)) { clearTimeout(RAGUI.reload); RAGUI.reload = setTimeout(loadDocs, 400); }
}

function renderProgress() {
  const el = $('#prog');
  if (!el) return;
  const rows = [...RAGUI.progress.values()].reverse().slice(0, 50);
  el.innerHTML = rows.map((p) => {
    const cls = p.stage === 'failed' ? 'err' : p.stage === 'indexed' ? 'ok' : ['duplicate', 'unchanged'].includes(p.stage) ? 'warn' : '';
    const pct = p.stage === 'indexed' ? 100 : p.of ? Math.round(100 * (p.embedded || 0) / p.of) : 0;
    const detail = p.error ? esc(p.error)
      : p.stage === 'duplicate' ? 'same content already ingested'
      : p.stage === 'embedding' ? `${p.embedded}/${p.of} chunks embedded`
      : p.chunks != null ? `${p.chunks} chunks` : '';
    return `<div class="prog"><span class="name" title="${esc(p.title || p.filename || p.doc_id)}">${esc(p.title || p.filename || p.doc_id)}</span>
      <span class="badge ${cls}">${esc(p.stage)}</span><span class="bar"><i style="width:${pct}%"></i></span><span class="dim">${detail}</span></div>`;
  }).join('');
}

/* ---------- Library ---------- */
async function library() {
  PAGE = null;
  ragEvents();
  const spaces = META.spaces.map((s) => `<option value="${s.key}"${s.key === SPACE ? ' selected' : ''}>${esc(s.name)}</option>`).join('');
  $('#wrap').innerHTML = `<h2 class="sec">Library</h2>
  <p class="lede">Drop training material here. Each file is extracted, its protected names are pseudonymised, then it is chunked, embedded by the local model and indexed — nothing leaves this machine. This is pseudonymisation, not anonymisation: the mapping is reversible locally and the data stays confidential.</p>
  <div class="drop" id="drop">
    <div>Drop PDF, DOCX, DOC, PPTX, HTML, Markdown, TXT or MHTML files — or whole folders</div>
    <div class="row">
      <select id="ispace" title="Space for the mirror pages"${ONE_SPACE()}>${spaces}</select>
      <select id="isens" title="Sensitivity"><option value="">space default sensitivity</option><option>Public</option><option>Internal</option><option>Client-Confidential</option><option>Restricted</option></select>
      <button class="btn" id="pickf">Choose files</button>
      <button class="btn" id="pickd">Choose folder</button>
    </div>
    <input type="file" id="fin" multiple hidden accept="${ACCEPT.join(',')}">
    <input type="file" id="din" webkitdirectory hidden>
  </div>
  <div id="prog"></div>
  <div class="meta" id="ragstat"></div>
  <table class="data" id="docs"><tr><td class="empty">Loading…</td></tr></table>
  <h2 class="sec">Answering settings</h2>
  <div class="settings" id="ragset"><span class="dim">Loading…</span></div>`;

  const drop = $('#drop');
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', async (e) => { e.preventDefault(); drop.classList.remove('over'); upload(await filesFromDrop(e.dataTransfer)); });
  $('#pickf').addEventListener('click', () => $('#fin').click());
  $('#pickd').addEventListener('click', () => $('#din').click());
  $('#fin').addEventListener('change', (e) => upload([...e.target.files].map((f) => [f, f.name])));
  $('#din').addEventListener('change', (e) => upload([...e.target.files].map((f) => [f, f.webkitRelativePath || f.name])));
  $('#docs').addEventListener('click', docAction);
  renderProgress();
  loadDocs();
  loadSettings();
}

/** Files (and folders, recursively) from a drop: [[File, relativePath]] */
async function filesFromDrop(dt) {
  const out = [];
  const walk = async (entry, prefix) => {
    if (entry.isFile) out.push([await new Promise((res, rej) => entry.file(res, rej)), prefix + entry.name]);
    else if (entry.isDirectory) {
      const reader = entry.createReader();
      for (let batch; (batch = await new Promise((res, rej) => reader.readEntries(res, rej))).length;) {
        for (const child of batch) await walk(child, prefix + entry.name + '/');
      }
    }
  };
  const entries = [...dt.items].map((i) => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (entries.length) for (const en of entries) await walk(en, '');
  else for (const f of dt.files) out.push([f, f.name]);
  return out;
}

async function upload(list) {
  const ok = list.filter(([f, rel]) => !/(^|\/)(~\$|\.)/.test(rel) && ACCEPT.some((x) => f.name.toLowerCase().endsWith(x)));
  const skipped = list.length - ok.length;
  if (!ok.length) return toast(skipped ? `${skipped} file(s) skipped: unsupported type` : 'No files');
  const fd = new FormData();
  for (const [f, rel] of ok) fd.append('file', f, rel);
  const q = new URLSearchParams({ space: $('#ispace').value });
  if ($('#isens').value) q.set('sensitivity', $('#isens').value);
  const resp = await fetch('/api/rag/ingest?' + q, { method: 'POST', body: fd });
  const body = await resp.json();
  if (!resp.ok) return toast(body.error || 'Upload failed');
  for (const r of body.rejected) onProgress({ doc_id: 'rejected:' + r.filename, filename: r.filename, stage: 'failed', error: r.error });
  toast(`${body.queued.length} file(s) queued${skipped ? `, ${skipped} skipped` : ''}${body.rejected.length ? `, ${body.rejected.length} rejected` : ''}`);
}

async function loadDocs() {
  const t = $('#docs');
  if (!t) return;
  try {
    const [docs, st] = await Promise.all([api('/rag/documents'), api('/rag/status')]);
    const points = st.collections.map((c) => `${c.name} ${c.points}`).join(', ') || 'no collection yet';
    $('#ragstat').textContent = `${st.mongo.documents} documents · ${st.mongo.chunks} chunks · embedding ${st.active_model} · Qdrant: ${points}` +
      (st.stale_documents ? ` · ${st.stale_documents} document(s) waiting to be re-masked` : '') + (st.queue ? ` · ${st.queue} in queue` : '');
    const badge = (d) => {
      const cls = d.status === 'ready' ? 'ok' : ['needs_ocr', 'restricted', 'empty'].includes(d.status) ? 'warn' : 'err';
      const label = d.status === 'needs_ocr' ? 'needs OCR' : d.status === 'restricted' ? 'restricted · not embedded' : d.status;
      return `<span class="badge ${cls}" title="${esc((d.warnings || []).join('\n'))}">${esc(label)}</span>`;
    };
    t.innerHTML = `<tr><th>Document</th><th>Type</th><th>Status</th><th>Chunks</th><th>Model</th><th>Ingested</th><th></th></tr>` +
      (docs.map((d) => `<tr data-id="${d.doc_id}">
        <td>${esc(d.title)}<div class="dim" style="font-size:11px">${esc(d.filename)}${d.sensitivity === 'Restricted' ? ' · <i class="chip re">R</i>' : ''}</div></td>
        <td class="mono dim">${esc(d.file_type)}</td><td>${badge(d)}</td><td class="mono">${d.chunk_count}</td>
        <td class="mono dim">${esc((d.embed_models || []).join(', '))}</td><td class="dim" style="font-size:12px">${esc(when(d.updated_at))}</td>
        <td style="white-space:nowrap">${d.page_id ? `<button class="btn" data-act="open" data-page="${d.page_id}">page</button>` : ''}
          <button class="btn" data-act="reingest"${d.has_source ? '' : ' disabled title="source file not stored — re-ingest from disk"'}>re-ingest</button>
          <button class="btn" data-act="delete" style="color:var(--red);border-color:var(--red)">delete</button></td></tr>`).join('')
      || '<tr><td colspan="7" class="empty">Nothing ingested yet. Drop files above.</td></tr>');
  } catch (e) {
    t.innerHTML = `<tr><td class="empty">RAG services unavailable (${esc(e.message)}). Start them with infra\\start-rag.ps1.</td></tr>`;
  }
}

async function docAction(e) {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  const id = b.closest('tr').dataset.id;
  if (b.dataset.act === 'open') return openPage(Number(b.dataset.page));
  if (b.dataset.act === 'reingest') {
    try { await api('/rag/documents/' + id + '/reingest', { body: {} }); toast('Re-ingest queued'); } catch (err) { toast(err.message); }
  }
  if (b.dataset.act === 'delete') {
    if (!confirm('Delete this document from the library?\n\nRemoves its chunks and vectors (Mongo + Qdrant), its mirror page and its review-queue entries.')) return;
    try { await api('/rag/documents/' + id, { method: 'DELETE' }); toast('Deleted'); loadDocs(); pick(SPACE); } catch (err) { toast(err.message); }
  }
}

async function loadSettings() {
  const el = $('#ragset');
  let models = [];
  try { models = (await api('/rag/models')).installed; } catch { /* Ollama down: show current values only */ }
  META = await api('/meta');
  const s = META.settings;
  const gens = models.filter((m) => m.family !== 'bert' && !/embed/.test(m.name));
  const genOpts = (gens.length ? gens.map((m) => m.name) : [s.rag_gen_model])
    .map((n) => `<option${n === s.rag_gen_model ? ' selected' : ''}>${esc(n)}</option>`).join('');
  el.innerHTML = `
    <label>Embedding model</label><span class="mono">${esc(s.rag_embed_model)} <span class="dim">— switch with <code>cadenzza rag reembed</code> + <code>activate</code></span></span>
    <label for="sg">Answer model</label><select id="sg">${genOpts}</select>
    <label for="sgpu">Answer model runs on</label><select id="sgpu"><option value="auto"${s.rag_gen_num_gpu === 'auto' ? ' selected' : ''}>GPU if available</option><option value="0"${s.rag_gen_num_gpu === '0' ? ' selected' : ''}>CPU only</option></select>
    <label for="sr">Retrieval</label><select id="sr">${['hybrid', 'dense', 'exact'].map((m) => `<option${m === s.rag_retrieval ? ' selected' : ''}>${m}</option>`).join('')}</select>
    <label for="sk">Sources per answer (top-k)</label><input id="sk" type="number" min="1" max="20" value="${esc(s.rag_top_k)}">
    <label for="sx">Embed Restricted files</label><span><input id="sx" type="checkbox"${s.rag_embed_restricted === '1' ? ' checked' : ''}> <span class="dim">off: Restricted files are recorded and mirrored, never embedded</span></span>
    <label for="sp">Mirror files as pages</label><span><input id="sp" type="checkbox"${s.rag_create_page === '1' ? ' checked' : ''}> <span class="dim">a Sources page per file, searchable in Strict/Fuzzy</span></span>
    <span></span><span><button class="btn p" id="ssave">Save settings</button></span>`;
  $('#ssave').addEventListener('click', async () => {
    try {
      await api('/settings', { body: {
        rag_gen_model: $('#sg').value, rag_gen_num_gpu: $('#sgpu').value, rag_retrieval: $('#sr').value,
        rag_top_k: String(Math.min(20, Math.max(1, Number($('#sk').value) || 6))),
        rag_embed_restricted: $('#sx').checked ? '1' : '0', rag_create_page: $('#sp').checked ? '1' : '0'
      } });
      toast('Settings saved');
    } catch (err) { toast(err.message); }
  });
}

/* ---------- Ask ---------- */
function askView() {
  PAGE = null;
  const spaces = META.spaces.map((s) => `<option value="${s.key}">${esc(s.name)}</option>`).join('');
  $('#wrap').innerHTML = `<h2 class="sec">Ask</h2>
  <p class="lede">Answers come only from the ingested material and cite their sources. Your question is pseudonymised before it is searched, and the local model only ever sees pseudonyms.</p>
  <div class="row"><input id="aq" style="flex:5" placeholder="e.g. What is our rollback procedure for a failed cutover?"><button class="btn p" id="ago" style="flex:0 0 auto">Ask</button></div>
  <div class="row" style="font-size:12px">
    <select id="aspace"${ONE_SPACE()}><option value="">all spaces</option>${spaces}</select>
    <select id="atype"><option value="">all file types</option>${['pdf', 'docx', 'doc', 'pptx', 'html', 'md', 'txt', 'mhtml'].map((t) => `<option>${t}</option>`).join('')}</select>
    <select id="amode"><option value="">retrieval: default</option><option>hybrid</option><option>dense</option><option>exact</option></select>
    <label style="flex:0 0 auto;align-self:center" title="Show real names instead of pseudonyms. Every reveal is written to the Audit log."><input type="checkbox" id="areveal"> Reveal names</label>
  </div>
  <div id="aout"></div>`;
  $('#ago').addEventListener('click', runAsk);
  $('#aq').addEventListener('keydown', (e) => { if (e.key === 'Enter') runAsk(); });
  $('#areveal').addEventListener('change', applyReveal);
  $('#aout').addEventListener('click', (e) => {
    const c = e.target.closest('.cite');
    if (c) { const d = $('#src-' + c.dataset.n); if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } }
    const o = e.target.closest('[data-page]');
    if (o) { e.preventDefault(); openPage(Number(o.dataset.page)); }
  });
  $('#aq').focus();
}

/** Escape, then turn [1] / [1, 2] / [2-3] into clickable source markers. */
const withCites = (t) => esc(t).replace(/\[(\d{1,2}(?:\s*[,–-]\s*\d{1,2})*)\]/g,
  (m, inner) => inner.split(/\s*,\s*/).map((n) => `<span class="cite" data-n="${n.split(/[–-]/)[0].trim()}">[${n}]</span>`).join(''));

function renderAnswer() {
  const a = RAGUI.ask;
  const answer = a.revealed ? a.revealed.answer : a.answer;
  const srcText = (s, i) => a.revealed ? a.revealed.sources[i] : s.text;
  $('#aout').innerHTML = `
    <div class="answer${a.done?.refused ? ' refused' : ''}${a.revealed ? ' revealed' : ''}">${withCites(answer) || '<span class="dim">Searching…</span>'}</div>
    ${a.done?.uncited ? '<p class="meta" style="color:#e0a95f">This answer cites no source — treat it with care.</p>' : ''}
    ${a.revealed ? '<p class="meta" style="color:#e88">Real names shown locally. This reveal is recorded in the Audit log.</p>' : ''}
    ${a.done ? `<p class="meta">${esc(a.done.gen_model)} · ${esc(a.done.retrieval_mode)}${a.done.retrieval_fallback ? ' (Qdrant unavailable: exact fallback)' : ''} · embed ${a.done.timings.embed_ms} ms · search ${a.done.timings.search_ms} ms · first words ${a.done.timings.first_visible_ms ?? '–'} ms · total ${a.done.timings.total_ms} ms</p>` : ''}
    ${a.sources.length ? `<h2 class="sec" style="font-size:15px">Sources</h2>` : ''}
    ${a.sources.map((s, i) => `<details class="src${s.cited ? ' cited' : ''}" id="src-${s.n}">
      <summary><span class="cite">[${s.n}]</span> ${esc(where(s))}${pageOf(s)} <span class="dim">· ${esc(s.file_type)} · ${s.score.toFixed(4)}</span></summary>
      <div class="chunk">${esc(srcText(s, i))}</div>
      ${s.page_id ? `<a href="#" data-page="${s.page_id}" class="dim" style="font-size:11px" title="Opens the local wiki copy of the file (real text, as stored locally)">open source page</a>` : ''}
    </details>`).join('')}`;
}

async function runAsk() {
  const question = $('#aq').value.trim();
  if (!question) return;
  RAGUI.ask?.ctrl?.abort();
  const a = RAGUI.ask = { answer: '', sources: [], done: null, revealed: null, ctrl: new AbortController() };
  $('#areveal').checked = false;
  renderAnswer();
  const filter = {};
  if ($('#aspace').value) filter.space = $('#aspace').value;
  if ($('#atype').value) filter.file_type = $('#atype').value;
  const body = { question, filter };
  if ($('#amode').value) body.mode = $('#amode').value;
  try {
    const resp = await fetch('/api/ask', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body), signal: a.ctrl.signal });
    if (!resp.ok) throw new Error((await resp.json()).error || resp.statusText);
    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = (frame.match(/^event: (.+)$/m) || [])[1], data = (frame.match(/^data: (.+)$/m) || [])[1];
        if (!ev || !data) continue;
        const d = JSON.parse(data);
        if (RAGUI.ask !== a) return; // superseded by a newer question
        if (ev === 'sources') a.sources = d;
        else if (ev === 'token') a.answer += d.delta;
        else if (ev === 'replace') a.answer = d.text;
        else if (ev === 'done') { a.done = d; a.answer = d.answer; a.sources = d.citations; }
        else if (ev === 'error') throw new Error(d.error);
        renderAnswer();
      }
    }
  } catch (err) {
    if (err.name !== 'AbortError') { a.answer = 'Error: ' + err.message; renderAnswer(); }
  }
}

/** Explicit, audited reveal of the current answer and its sources; unticking restores pseudonyms. */
async function applyReveal() {
  const a = RAGUI.ask;
  if (!a || !a.done) { $('#areveal').checked = false; return toast('Ask a question first'); }
  if (!$('#areveal').checked) { a.revealed = null; return renderAnswer(); }
  const SEP = '\n␞\n';
  try {
    const { text } = await api('/unmask', { body: { text: [a.answer, ...a.sources.map((s) => s.text)].join(SEP), reason: 'ask: reveal names' } });
    const [answer, ...sources] = text.split(SEP);
    a.revealed = { answer, sources };
    renderAnswer();
    toast('Names revealed locally — logged in Audit');
  } catch (err) { $('#areveal').checked = false; toast(err.message); }
}

/* Files dropped anywhere in the window go to the Library (otherwise the browser opens them and leaves the app). */
const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
let dragDepth = 0;
const endDrag = () => { dragDepth = 0; document.body.classList.remove('dragging'); };
addEventListener('dragenter', (e) => { if (hasFiles(e)) { dragDepth++; document.body.classList.add('dragging'); } });
addEventListener('dragleave', (e) => { if (hasFiles(e) && --dragDepth <= 0) endDrag(); });
addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
addEventListener('drop', async (e) => {
  endDrag();
  if (!hasFiles(e) || e.defaultPrevented) return; // the Library drop zone handled it
  e.preventDefault();
  if (!$('#drop') && DIRTY) return toast('Save or discard the page you are editing, then drop again');
  const list = await filesFromDrop(e.dataTransfer);
  if (!$('#drop')) await library();
  upload(list);
});

$('#askbtn').addEventListener('click', askView);
$('#libbtn').addEventListener('click', library);
boot();
</script>
